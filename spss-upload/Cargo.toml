[package]
name = "statdesk"
version = "1.0.0"
edition = "2021"
description = "StatDesk - a lightweight statistics workbench"

[[bin]]
name = "statdesk"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[profile.dev]
opt-level = 1
debug = 0
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
debug = 0
